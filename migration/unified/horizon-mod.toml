id = "naturalist"
name = "Naturalist metadata development"
version = "0.8.0-dev.1"
api = "0.2"
side = "both"
capabilities = ["registries"]
[native]
game = "26.3"
horizon = "0a875da91dbb0fdcb7ba8c42c11341aa229af51a"
