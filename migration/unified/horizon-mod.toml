[[native.mixin]]
id = "metadata"
target = "horizon_client::game::resource_load::take_modified_attribute_rows"
kind = "HEAD"
helper = "src/metadata.rs"
bindings = [
 {name = "types", ty = "&mut HashMap<String, horizon_client::mobs::MobType>", value = "&mut *types"},
 {name = "catalog", ty = "&horizon_world::attributes::entity::Catalog", value = "catalog"},
]

