[[state.constructor]]
target = "horizon_client_lib::mobs::nav::<Navigation as Default>::default"
selector = "Self"
require = 1

[[injection]]
id = "alligator-commit-nest-target"
target = "horizon_client::game::native_ticks::Game<'_>::native_tick_post_batch"
kind = "HEAD"
helper = "alligator_commit_nest_target.rs"
bindings = [{name = "game", ty = "&mut Game<'_>", value = "&mut *self"}]

[[injection]]
id = "deer-spawn-skip-farm-finalize"
target = "horizon_client_lib::mobs::spawning::finalize"
kind = "HEAD"
cancellable = true
helper = "deer_spawn_skip_donor.rs"
bindings = [{ name = "mob", ty = "&mut Mob", value = "&mut *m" }]

[[injection]]
id = "naturalist-entity-tracking-settings"
target = "horizon_client_lib::lan::tracking::settings"
kind = "HEAD"
cancellable = true
helper = "naturalist_tracking_settings.rs"
bindings = [{name = "kind", ty = "&str", value = "kind"}]

[[injection]]
id = "naturalist-spawn-order"
target = "horizon_client_lib::mod_content::biomes::apply"
kind = "HEAD"
cancellable = true
helper = "naturalist_spawn_order.rs"
bindings = [
  { name = "biomes", ty = "&mut J", value = "&mut *biomes" },
  { name = "modifiers", ty = "&[Modifier]", value = "modifiers" },
  { name = "biome_reg", ty = "&Registry<'_>", value = "biome_reg" },
  { name = "feature_reg", ty = "&Registry<'_>", value = "feature_reg" },
  { name = "entity_reg", ty = "&Registry<'_>", value = "entity_reg" },
  { name = "entity_categories", ty = "&BTreeMap<String, String>", value = "entity_categories" },
  { name = "warnings", ty = "&mut Vec<String>", value = "&mut *warnings" },
]

[[injection]]
id = "bird-heightmap"
target = "horizon_client::game::natural_spawning::<GameLevel<'_,'_> as NaturalLevel>::heightmap"
kind = "HEAD"
cancellable = true
helper = "bird_heightmap.rs"
bindings = [
 {name = "level", ty = "&GameLevel<'_, '_>", value = "self"},
 {name = "kind", ty = "Heightmap", value = "kind"},
 {name = "x", ty = "i32", value = "x"},
 {name = "z", ty = "i32", value = "z"},
]

[[injection]]
id = "bird-support"
target = "horizon_client_lib::mobs::data::MobData::state"
kind = "RETURN"
helper = "bird_support.rs"
bindings = [{name = "state", ty = "StateData", value = "$value"}]
