[mod]
id = "naturalist_bird_region_fixture"
version = "0.1.1"

[compatibility]
horizon_revision = "9f42064c11efe7ef3e5ed2baad7ddc2a3b36eea0"

[[injection]]
id = "naturalist-bird-region-probe"
target = "horizon_client::game::commands::Game<'_>::run_command"
kind = "HEAD"
cancellable = true
helper = "bird_region_probe.rs"
bindings = [
  { name = "game", ty = "&mut Game<'_>", value = "&mut *self" },
  { name = "command", ty = "&str", value = "command" },
]


[[injection]]
id = "bird-region-transient-age"
target = "horizon_client_lib::vanillagen::structure_mobs::tree"
kind = "RETURN"
helper = "bird_region_transient_age.rs"
bindings = [
 {name = "saved", ty = "Compound", value = "$value"},
 {name = "mobs", ty = "&[(Mob, Option<Tag>)]", value = "mobs"},
 {name = "i", ty = "usize", value = "i"},
]
